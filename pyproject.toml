[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dreammachine"
version = "0.1.0"
description = "Construct-valid weakness-targeted synthetic data generation for small language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "sqlmodel>=0.0.16"]
ml = [
    "torch>=2.2",
    "transformers>=4.56",
    "peft>=0.12",
    "accelerate>=0.33",
    "datasets>=2.20",
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["dreammachine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU",
    "slow: downloads models or datasets",
]
