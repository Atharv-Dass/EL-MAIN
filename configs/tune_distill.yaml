# Dev-set test of self-distilled solution texts (PLAN.md D14, approved by the user 2026-10-06).
#   python -m dreammachine.experiments.tune --config configs/tune_distill.yaml
# EXPLORE ONLY. Same dev set, probes, model and diagnosis as configs/tune.yaml, whose untrained-model eval is reused.
# Question: does training on the base model's own (checked) solutions remove the GSM8K-dev regression of
# docs/RUNNING.md §10 while keeping the probe / target-slice gain? Both variants use the same 100k-token budget,
# so the only difference is the solution text. max_seq_len 768 (explore: 512) so a 512-token model answer plus its
# prompt is not cut during training; it changes nothing for the short original solutions.
base: configs/explore.yaml
model: Qwen/Qwen3-0.6B
seed: 0
dev_holdout: 200
diagnosis_from: runs/pipelines/5a584e16390b
output_dir: runs/tuning/qwen06_distill
base_results: runs/tuning/qwen06/results/base.json
eval:
  probes_heldout_families: 100
variants:
  - {name: distilled_b100k_r3,   arm: targeted, ratio: 3, data: {token_budget: 100000}, train: {max_seq_len: 768},
     distill: {samples: 2, temperature: 0.7, top_p: 0.8, max_new_tokens: 512, batch_size: 32}}
  - {name: undistilled_b100k_r3, arm: targeted, ratio: 3, data: {token_budget: 100000},
     train: {max_seq_len: 768}}   # same budget, original text
