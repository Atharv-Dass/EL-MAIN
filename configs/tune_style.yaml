# Dev-set test of longer code-written solutions (option b of docs/RUNNING.md §10; approved by the user 2026-10-06).
#   python -m dreammachine.experiments.tune --config configs/tune_style.yaml
# EXPLORE ONLY. Same dev set, probes, model, diagnosis, budget and training settings as configs/tune_distill.yaml and
# the same output folder, so its two finished variants are reused (skipped) and summary.md compares all three.
# data.solution_style: steps rewrites every training solution (synthetic AND real GSM8K) by code into a longer
# step-by-step form (dreammachine/data/style.py); equations and answers are unchanged. No model-written text.
base: configs/explore.yaml
model: Qwen/Qwen3-0.6B
seed: 0
dev_holdout: 200
diagnosis_from: runs/pipelines/5a584e16390b
output_dir: runs/tuning/qwen06_distill
base_results: runs/tuning/qwen06/results/base.json
eval:
  probes_heldout_families: 100
variants:
  - {name: distilled_b100k_r3,   arm: targeted, ratio: 3, data: {token_budget: 100000}, train: {max_seq_len: 768},
     distill: {samples: 2, temperature: 0.7, top_p: 0.8, max_new_tokens: 512, batch_size: 32}}
  - {name: undistilled_b100k_r3, arm: targeted, ratio: 3, data: {token_budget: 100000},
     train: {max_seq_len: 768}}
  - {name: steps_style_b100k_r3, arm: targeted, ratio: 3, data: {token_budget: 100000, solution_style: steps},
     train: {max_seq_len: 768}}
